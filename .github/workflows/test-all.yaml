name: "CI - Test Features"
on:
  push:
    branches:
      - trunk
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  DOCKER_HOST: unix:///run/user/0/podman/podman.sock
  XDG_RUNTIME_DIR: /run/user/0

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        chain:
          - with-base
          - git with-base
          - podman with-base
          - podman-in-podman podman with-base
          - podman-outside-of-podman podman with-base
          - with-podman podman-in-podman podman-outside-of-podman podman with-base
          - nvm with-base
          - node nvm with-base
          - dotagents node nvm with-base
        baseImage:
          - registry.fedoraproject.org/fedora-minimal:latest
          - registry.fedoraproject.org/fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: "Boot rootful podman engine + socket"
        run: |
          set -euo pipefail
          dnf install -y --quiet podman podman-docker nodejs npm git
          mkdir -p /run/user/0/podman
          podman system service --time=0 unix:///run/user/0/podman/podman.sock &
          for i in $(seq 1 60); do [ -S /run/user/0/podman/podman.sock ] && break; sleep 1; done
          npm install -g @devcontainers/cli

      - name: "Autogenerated test: ${{ matrix.chain }} on ${{ matrix.baseImage }}"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.chain }} --base-image ${{ matrix.baseImage }} -p .

  test-scenarios:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        feature:
          - with-base
          - podman
          - node
          - dotagents
          - with-podman
    steps:
      - uses: actions/checkout@v4

      - name: "Boot rootful podman engine + socket"
        run: |
          set -euo pipefail
          dnf install -y --quiet podman podman-docker nodejs npm git
          mkdir -p /run/user/0/podman
          podman system service --time=0 unix:///run/user/0/podman/podman.sock &
          for i in $(seq 1 60); do [ -S /run/user/0/podman/podman.sock ] && break; sleep 1; done
          npm install -g @devcontainers/cli

      - name: "Scenarios for ${{ matrix.feature }}"
        run: devcontainer features test --skip-autogenerated -f ${{ matrix.feature }} -p .

  test-global:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: "Boot rootful podman engine + socket"
        run: |
          set -euo pipefail
          dnf install -y --quiet podman podman-docker nodejs npm git
          mkdir -p /run/user/0/podman
          podman system service --time=0 unix:///run/user/0/podman/podman.sock &
          for i in $(seq 1 60); do [ -S /run/user/0/podman/podman.sock ] && break; sleep 1; done
          npm install -g @devcontainers/cli

      - name: "Global scenarios"
        run: devcontainer features test --global-scenarios-only -p .