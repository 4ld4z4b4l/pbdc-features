name: "CI - Test Features"
on:
  push:
    branches:
      - trunk
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:46
      options: --privileged
    steps:
      - name: "Install build tools"
        run: |
          set -euo pipefail
          dnf install -y --quiet podman git

      - uses: actions/checkout@v4

      - name: "Build authoring devcontainer image"
        run: |
          set -euo pipefail
          podman build -t pbdc-features:authoring -f .devcontainer/Containerfile .

      - name: "Run full feature test suite inside the authoring devcontainer"
        run: |
          set -euo pipefail
          podman run --rm --privileged \
            -v "$PWD":/repo:ro -w /repo \
            pbdc-features:authoring bash -c 'bash scripts/test-features.sh'